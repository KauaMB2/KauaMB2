<svg width="900" height="200" viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f1a"/>
      <stop offset="50%" style="stop-color:#1a1a3e"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0.1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="200" fill="url(#bg)"/>

  <!-- Wave shapes -->
  <path d="M0,160 C150,120 300,180 450,140 C600,100 750,160 900,130 L900,200 L0,200 Z" fill="url(#wave1)" opacity="0.4"/>
  <path d="M0,175 C200,145 400,185 600,155 C750,135 850,165 900,150 L900,200 L0,200 Z" fill="#00d4ff" opacity="0.05"/>

  <!-- Dots decoration -->
  <circle cx="50" cy="40" r="2" fill="#00d4ff" opacity="0.4"/>
  <circle cx="80" cy="25" r="1.5" fill="#00d4ff" opacity="0.3"/>
  <circle cx="820" cy="35" r="2" fill="#7c3aed" opacity="0.4"/>
  <circle cx="860" cy="55" r="1.5" fill="#00d4ff" opacity="0.3"/>
  <circle cx="840" cy="20" r="1" fill="#00d4ff" opacity="0.5"/>

  <!-- Main title -->
  <text x="450" y="90" font-family="'Segoe UI', Arial, sans-serif" font-size="42" font-weight="700"
        fill="#00d4ff" text-anchor="middle" filter="url(#glow)" letter-spacing="1">
    Kauã Moreira Batista
  </text>

  <!-- Subtitle -->
  <text x="450" y="125" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400"
        fill="#8892b0" text-anchor="middle" letter-spacing="2">
    FULLSTACK DEVELOPER  ·  AI  ·  COMPUTER VISION
  </text>

  <!-- Bottom line accent -->
  <line x1="300" y1="145" x2="600" y2="145" stroke="#00d4ff" stroke-width="1" opacity="0.3"/>
  <circle cx="300" cy="145" r="2" fill="#00d4ff" opacity="0.5"/>
  <circle cx="600" cy="145" r="2" fill="#00d4ff" opacity="0.5"/>
</svg>
